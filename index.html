<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Rabbit Boy</title>
<style>
  :root { color-scheme: dark; --ink:#1d1740; --sky:#79d6f2; --grass:#5ab84c; --earth:#945638; --gold:#ffd743; --pink:#f25c93; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(#242258,#101128); font-family:ui-rounded,system-ui,sans-serif; color:#fff; }
  main { width:min(940px,100%); padding:16px; text-align:center; }
  h1 { margin:0 0 4px; font-size:clamp(1.6rem,5vw,2.7rem); letter-spacing:.04em; text-shadow:3px 3px var(--ink); }
  p { margin:0 0 12px; color:#dfe9ff; }
  canvas { width:100%; aspect-ratio:16/9; display:block; background:var(--sky); border:5px solid #fff; border-radius:12px; box-shadow:0 8px 0 var(--ink), 0 18px 40px #0008; touch-action:none; image-rendering:pixelated; }
  .bar { margin:14px auto 0; display:flex; justify-content:center; gap:9px; flex-wrap:wrap; }
  button { min-width:72px; padding:10px 15px; border:0; border-radius:9px; background:#fff; color:var(--ink); font:600 1rem inherit; box-shadow:0 4px 0 #aeb9d3; cursor:pointer; }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #aeb9d3; }
  .status { min-height:1.5em; margin-top:10px; font-weight:700; }
  @media (max-width:520px) { main { padding:10px; } p { font-size:.88rem; } button { min-width:60px; padding:10px 12px; } }
</style>
</head>
<body>
<main>
  <h1>SUPER RABBIT BOY</h1>
  <p>Collect carrots, bop the baddies, and reach the rainbow flag!</p>
  <canvas id="game" width="960" height="540" aria-label="Playable Super Rabbit Boy game"></canvas>
  <div class="bar" aria-label="Game controls"><button id="play">Play</button><button id="left">◀ Left</button><button id="forward">Forward</button><button id="jump">▲ Jump</button><button id="back">Back</button><button id="right">Right ▶</button><button id="dash">Dash</button><button id="attack">Attack</button><button id="restart">Restart</button></div>
  <div class="status" id="status">Press Play, then use the arrows or buttons</div>
</main>
<script>
(() => {
  const c = document.querySelector('#game'), x = c.getContext('2d'), status = document.querySelector('#status');
  const W=c.width,H=c.height, ground=458, keys={}; let won=false, lost=false, started=false, score=0, scroll=0, attackTimer=0;
  const rabbit={x:90,y:300,w:44,h:52,vx:0,vy:0,depth:0,onGround:false,face:1};
  const platforms=[[-120,ground,440,82],[375,390,150,26],[560,335,130,26],[735,402,150,26],[930,350,135,26],[1135,458,270,82],[1490,385,125,26],[1685,325,145,26],[1890,390,145,26],[2130,458,350,82]];
  const carrots=[{x:240,y:414},{x:430,y:346},{x:604,y:291},{x:785,y:358},{x:980,y:306},{x:1210,y:414},{x:1540,y:341},{x:1740,y:281},{x:1940,y:346},{x:2220,y:414}];
  const boss={x:448,y:330,w:56,h:60,dead:false,hp:3};
  const foes=[{x:650,y:303,w:36,h:32,v:1,min:560,max:654},{x:963,y:318,w:36,h:32,v:1,min:930,max:1029},{x:1195,y:426,w:38,h:32,v:1,min:1135,max:1367},{x:1760,y:293,w:36,h:32,v:-1,min:1685,max:1794},{x:2190,y:426,w:38,h:32,v:1,min:2130,max:2432}];
  const flag={x:2380,y:315};
  function reset(){ Object.assign(rabbit,{x:90,y:300,vx:0,vy:0,depth:0,onGround:false,face:1}); carrots.forEach(q=>q.got=false); foes.forEach((f,i)=>{f.dead=false; f.x=[650,963,1195,1760,2190][i]}); boss.dead=false;boss.hp=3;score=0;scroll=0;attackTimer=0;won=lost=false;started=false;status.textContent='Press Play, then use the arrows or buttons'; }
  function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
  function input(){ let d=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0); rabbit.vx+=d*.72; if(d) rabbit.face=d; rabbit.vx*=.79;rabbit.depth+=((keys.w?1:0)-(keys.s?1:0))*3.2;rabbit.depth=Math.max(-50,Math.min(50,rabbit.depth));if((keys.ArrowUp||keys.space)&&rabbit.onGround){rabbit.vy=-14; rabbit.onGround=false;}}
  function update(){
    if(!started||won||lost) return; input();attackTimer=Math.max(0,attackTimer-1);rabbit.vy+=.68; rabbit.x+=rabbit.vx; rabbit.y+=rabbit.vy; rabbit.onGround=false;
    for(const p of platforms){const hit=rect(rabbit,{x:p[0],y:p[1],w:p[2],h:p[3]}); if(hit&&rabbit.vy>=0&&rabbit.y+rabbit.h-rabbit.vy<=p[1]+8){rabbit.y=p[1]-rabbit.h;rabbit.vy=0;rabbit.onGround=true;} }
    rabbit.x=Math.max(0,rabbit.x); if(rabbit.y>H+80){lost=true; status.textContent='Oh no! Try again.'}
    for(const q of carrots) if(!q.got&&Math.hypot(rabbit.x+22-q.x,rabbit.y+26-q.y)<33&&Math.abs(rabbit.depth)<32){q.got=true;score++;}
    if(!boss.dead&&Math.abs(rabbit.depth)<27&&rect(rabbit,boss)){if(rabbit.vy>2&&rabbit.y+rabbit.h<boss.y+22){boss.hp--;rabbit.vy=-12;score+=2;if(boss.hp===0){boss.dead=true;score+=5;status.textContent='King Viking defeated! Now clear the robots!';}else status.textContent='King Viking is hurt — '+boss.hp+' hits left!';}else{lost=true;status.textContent='King Viking blocked the path! Try again.'}}
    for(const f of foes){if(f.dead)continue;f.x+=f.v*2.05;if(f.x<f.min||f.x>f.max)f.v*=-1;let hitbox={x:rabbit.x+(rabbit.face>0?rabbit.w-5:-25),y:rabbit.y+8,w:30,h:28};if(Math.abs(rabbit.depth)<27&&attackTimer&&rect(hitbox,f)){f.dead=true;score+=2;status.textContent='Robot smashed!';}else if(Math.abs(rabbit.depth)<27&&rect(rabbit,f)){if(rabbit.vy>2&&rabbit.y+rabbit.h<f.y+18){f.dead=true;rabbit.vy=-9;score+=2;}else{lost=true;status.textContent='A robot got you! Try again.'}}}
    if(rabbit.x+rabbit.w>flag.x){if(!boss.dead||foes.some(f=>!f.dead)){rabbit.x=flag.x-rabbit.w;status.textContent=!boss.dead?'King Viking is still standing!':'The robots are still guarding the flag!';}else{won=true;status.textContent='You saved Carrot Kingdom!';}}
    scroll=Math.max(0,Math.min(1580,rabbit.x-250));
  }
  function cloud(px,py){x.fillStyle='#ffffffbb';x.fillRect(px,py,72,19);x.fillRect(px+12,py-13,42,36);x.fillRect(px+26,py-23,20,52);}
  function pixels(px,py,w,h,col){x.fillStyle=col;x.fillRect(px,py,w,h)}
  function draw(){
    x.clearRect(0,0,W,H); x.fillStyle='#6bc9e9';x.fillRect(0,0,W,H); x.fillStyle='#52afd3';x.fillRect(0,246,W,94); x.fillStyle='#ffec7a';x.fillRect(766,42,68,68);x.fillStyle='#fff8ba';x.fillRect(778,54,44,44);
    cloud(120-scroll*.12,100);cloud(500-scroll*.09,150);cloud(880-scroll*.15,82);
    x.fillStyle='#4c9e60'; for(let i=-1;i<8;i++){let px=i*210-(scroll*.22%210);x.beginPath();x.moveTo(px,420);x.lineTo(px+105,270);x.lineTo(px+210,420);x.fill();} x.fillStyle='#7cc65c'; for(let i=-1;i<8;i++){let px=i*220-(scroll*.35%220);x.fillRect(px,334,220,126);x.fillStyle='#62ae53';x.fillRect(px+26,306,166,36);x.fillStyle='#7cc65c';}
    for(const p of platforms){let [px,py,pw,ph]=p;px-=scroll;x.fillStyle='#5c2c31';x.beginPath();x.moveTo(px+pw,py);x.lineTo(px+pw+13,py+10);x.lineTo(px+pw+13,py+ph+10);x.lineTo(px+pw,py+ph);x.fill();x.fillStyle='#803f2c';x.fillRect(px,py,pw,ph);x.fillStyle='#b9613e';for(let d=8;d<pw;d+=28)x.fillRect(px+d,py+20+(d%3)*10,12,8);x.fillStyle='#3a933d';x.fillRect(px,py,pw,14);x.fillStyle='#87df58';x.fillRect(px,py,pw,5);for(let d=12;d<pw;d+=38)x.fillRect(px+d,py-5,7,7);}
    for(const q of carrots)if(!q.got){let px=q.x-scroll,py=q.y;pixels(px-9,py-17,7,9,'#2e9b4e');pixels(px+2,py-19,7,11,'#3cc45a');pixels(px-7,py-5,14,18,'#ff8344');pixels(px-4,py+13,8,4,'#e8573a');}
    if(!boss.dead){let bx=boss.x-scroll,by=boss.y;pixels(bx+12,by-14,12,14,'#d6b34a');pixels(bx+32,by-14,12,14,'#d6b34a');pixels(bx+4,by,boss.w-8,50,'#6651aa');pixels(bx+10,by+8,36,26,'#f0b39e');pixels(bx+13,by+14,7,7,'#282344');pixels(bx+36,by+14,7,7,'#282344');pixels(bx+17,by+29,20,4,'#8c3b4c');pixels(bx,by+50,23,10,'#3a315e');pixels(bx+33,by+50,23,10,'#3a315e');x.fillStyle='#fff';x.font='bold 12px system-ui';x.fillText('KING VIKING',bx-12,by-21);x.fillStyle='#342340';x.fillRect(bx,by-31,56,6);x.fillStyle='#fa6c72';x.fillRect(bx,by-31,boss.hp*18,6);}
    for(const f of foes)if(!f.dead){let px=f.x-scroll;pixels(px+4,f.y-6,8,7,'#68355d');pixels(px+24,f.y-6,8,7,'#68355d');pixels(px,f.y+1,f.w,27,'#e94e76');pixels(px+4,f.y+28,11,5,'#622c50');pixels(px+23,f.y+28,11,5,'#622c50');pixels(px+7,f.y+8,8,8,'#fff6df');pixels(px+22,f.y+8,8,8,'#fff6df');pixels(px+10,f.y+11,3,4,'#32204a');pixels(px+25,f.y+11,3,4,'#32204a');pixels(px+15,f.y+21,7,3,'#fff6df');}
    let fx=flag.x-scroll;x.fillStyle='#ece9ff';x.fillRect(fx,flag.y,7,145);x.fillStyle='#ef5c98';x.beginPath();x.moveTo(fx+7,flag.y);x.lineTo(fx+78,flag.y+27);x.lineTo(fx+7,flag.y+52);x.fill();
    let rx=rabbit.x-scroll,ry=rabbit.y+rabbit.depth,scale=1+rabbit.depth/250;x.save();x.translate(rx+22,ry+26);x.scale(rabbit.face*scale,scale);pixels(-18,-37,12,28,'#f5f0df');pixels(6,-37,12,28,'#f5f0df');pixels(-14,-33,5,18,'#f3a8b7');pixels(10,-33,5,18,'#f3a8b7');pixels(-22,-9,44,30,'#f5f0df');pixels(-17,18,14,8,'#36385a');pixels(6,18,14,8,'#36385a');pixels(-16,5,32,17,'#387eb2');pixels(-20,-4,10,14,'#387eb2');pixels(10,-4,10,14,'#387eb2');pixels(5,-6,6,7,'#262446');pixels(-8,-6,6,7,'#262446');pixels(3,5,7,4,'#f06c83');pixels(-12,4,6,3,'#f1c747');if(attackTimer){pixels(21,-3,27,7,'#ffe66d');pixels(42,-8,8,18,'#fff7bc');}x.restore();
    x.fillStyle='#2c7848';for(let i=-1;i<10;i++){let px=i*125-(scroll*.82%125);x.fillRect(px,491,125,49);x.fillStyle='#51ad50';x.fillRect(px+8,482,16,12);x.fillRect(px+57,474,12,20);x.fillRect(px+100,485,15,9);x.fillStyle='#2c7848';}
    x.fillStyle='#1d1740cc';x.fillRect(16,14,178,42);x.fillStyle='#fff';x.font='bold 20px system-ui';x.fillText('🥕 '+score+' / '+(carrots.length+foes.length*2),30,42);
    if(!started||won||lost){x.fillStyle='#16102ddd';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='bold 54px system-ui';x.fillText(!started?'READY?':won?'YOU WIN!':'TRY AGAIN!',W/2,H/2-12);x.font='24px system-ui';x.fillText(!started?'Press Play or Space to start':won?'Super Rabbit Boy rules!':'Press Restart to hop back in.',W/2,H/2+34);x.textAlign='left';}
  }
  function frame(){update();draw();requestAnimationFrame(frame)}
  function attack(){if(started){attackTimer=13;status.textContent='Side attack!';}}
  addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','x','X','z','Z'].includes(e.key))e.preventDefault();if(e.key===' '&&!started){started=true;status.textContent='Bop King Viking first, then clear the robots!';}if((e.key==='x'||e.key==='X')&&started){rabbit.vx=rabbit.face*13;status.textContent='Forward dash!';}if(e.key==='z'||e.key==='Z')attack();keys[e.key===' '?'space':e.key]=true});addEventListener('keyup',e=>keys[e.key===' '?'space':e.key]=false);
  [['left','ArrowLeft'],['right','ArrowRight'],['jump','ArrowUp'],['forward','w'],['back','s']].forEach(([id,k])=>{let b=document.querySelector('#'+id);['pointerdown','pointerup','pointerleave','pointercancel'].forEach(type=>b.addEventListener(type,e=>{e.preventDefault();started=true;status.textContent='Use all four directions to dodge and attack!';keys[k]=type==='pointerdown';}));});document.querySelector('#dash').onclick=()=>{started=true;rabbit.vx=rabbit.face*13;status.textContent='Forward dash!';};document.querySelector('#attack').onclick=()=>{started=true;attack();};document.querySelector('#play').onclick=()=>{started=true;status.textContent='Bop King Viking first, then clear the robots!';};document.querySelector('#restart').onclick=reset;frame();
})();
</script>
</body>
</html>
